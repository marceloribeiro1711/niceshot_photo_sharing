<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Photo Sharing</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f5fbf">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Photo Sharing">
<style>
:root{--bg:#f2f5f7;--card:#fff;--ink:#12202b;--mute:#5b6b78;--line:#d5dde3;--blue:#1f5fbf;--ball:#d8e24a;--red:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0f1820;--card:#17232d;--ink:#e8eef2;--mute:#93a4b1;--line:#2a3945;--blue:#6aa2f5;--red:#f2877f}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;height:calc(var(--vh,1vh)*100);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}
h1{font-size:18px;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button,input,textarea{font:inherit;color:inherit}
button{min-height:44px;padding:0 14px;border:1px solid var(--line);background:var(--card);border-radius:8px;cursor:pointer}
button.p{background:var(--blue);color:#fff;border-color:var(--blue)}
button:disabled{opacity:.45}
main{flex:1;min-height:0;overflow-y:auto;width:100%;max-width:720px;margin:0 auto;padding:0 14px}
#album{padding-bottom:24px}
.card{display:block;width:100%;text-align:left;margin:10px 0;padding:14px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.card b{display:block;font-size:17px}
.mute{color:var(--mute);font-size:14px}
#pinbox{text-align:center;padding-top:16px}
#pinbox h2{margin:0 0 4px;font-size:24px;line-height:1.2}
#pin{width:9ch;font:700 40px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.2em;text-align:center;background:var(--ball);color:#1b2200;border:0;border-radius:8px;padding:4px 0 4px .2em}
.bar{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;background:var(--bg)}
.g{position:relative}
.g .t{position:absolute;overflow:hidden;border-radius:4px;background:var(--line)}
.g .t img{display:block;width:100%;height:100%;object-fit:cover}
.camt{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:10px;border-radius:4px;background:var(--card);border:1px solid var(--line);color:var(--ink)}
.camt svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.camt b{font-size:13px;line-height:1.25;font-weight:600}
.t{position:relative}

.k{position:absolute;top:4px;right:4px;width:30px;min-height:30px;height:30px;padding:0;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.35);color:#fff;font-weight:700}
.t.on img{outline:3px solid var(--blue);outline-offset:-3px}
.t.on .k{background:var(--blue)}
.t.on::after{content:"";position:absolute;inset:0;border:3px solid var(--blue);border-radius:4px;pointer-events:none}
.prog{margin:8px 0;padding:10px;border-radius:8px;background:var(--card);border:1px solid var(--line)}
.prog i{display:block;height:6px;margin-top:6px;background:var(--blue);border-radius:3px;width:0}
#home{margin:0 -14px;height:100%;display:flex;flex-direction:column}
#car{flex:1;min-height:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
#car::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column;min-height:0}
.mid{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-start;padding-top:10px}
.cw{position:relative;width:min(70%,calc(var(--vh,1vh)*36));aspect-ratio:1;margin:0 auto}
.cover{position:absolute;inset:0;overflow:hidden;border-radius:12px;background:linear-gradient(135deg,var(--blue),#0d3470)}
.cover img{position:absolute;inset:0;width:100%;height:100%}
.cover .bg{object-fit:cover;filter:blur(22px) brightness(.7);transform:scale(1.25)}
.cover .fg{object-fit:contain}
.hb{display:flex;align-items:center;gap:6px;min-height:40px;padding:0 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;text-decoration:none;color:var(--ink);flex:none}
.hb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dock{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 14px;background:var(--card);border-top:1px solid var(--line)}
.dock .nv{width:48px;padding:0;flex:none;display:flex;align-items:center;justify-content:center}
.dock .nv svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.dock .c{flex:1}
#ad{gap:4px;padding:6px 8px}
#ad button{flex:1;min-width:0;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px 2px;border:0;background:none;color:var(--ink);font-size:12px;line-height:1.15}
#ad svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#ad #dl:not(:disabled){color:var(--blue);font-weight:600}
.bar:has(#sv[hidden]){display:none}
.info{padding:14px 18px 4px;text-align:center}
.info h2{margin:0 0 4px;font-size:24px;line-height:1.2}
.meta{color:var(--mute);font-size:15px}
a{color:var(--blue)}
#dots{display:flex;justify-content:center;gap:6px;padding:12px 0 14px}
#dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
#dots i.on{background:var(--blue)}
#vw{flex:1;min-height:0;position:relative;background:#000;display:flex;align-items:center;justify-content:center}
#vw img{max-width:100%;max-height:100%;object-fit:contain}
#vw .top{position:absolute;top:8px;left:12px;right:10px;display:flex;justify-content:space-between;align-items:center;color:#fff;text-shadow:0 1px 3px #000}
#vw button.v{width:40px;height:40px;min-height:40px;padding:0;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.5);color:#fff;font-weight:700}
#vw button.v.on{background:var(--blue)}
#vw .side{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:56px;min-height:56px;padding:0;border:0;border-radius:8px;background:rgba(0,0,0,.4);color:#fff;font-size:30px}
#vw .side.l{left:6px}#vw .side.r{right:6px}
textarea{width:100%;min-height:90px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.r{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;justify-content:center}
#msg{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:8px;display:none;z-index:9}
#adm button,#adm input,#adm select{font:inherit;color:inherit}
#adm button{min-height:44px;padding:0 14px;border:1px solid var(--line);background:var(--card);border-radius:8px;cursor:pointer}
#adm button.danger{color:var(--red)}
#adm button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
#adm .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
#adm .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
#adm .pin{display:inline-block;margin:10px 0 6px;padding:4px 14px;background:var(--ball);color:#1b2200;font:700 34px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;border-radius:6px}
#adm .off{opacity:.55}
#adm .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
#adm dialog{width:min(560px,94vw);border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:16px}
#adm dialog::backdrop{background:rgba(0,0,0,.45)}
#adm label{display:block;margin:10px 0 4px;font-size:14px;color:var(--mute)}
#adm input[type=text],#adm input[type=number],#adm input[type=password],#adm input[type=date]{width:100%;min-height:44px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
#adm .chk{display:flex;gap:8px;align-items:center;margin-top:12px;color:var(--ink);font-size:16px}
#adm .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:10px}
#adm .grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;background:var(--line);cursor:pointer}
#adm .grid>div{position:relative}#adm .st{position:absolute;top:2px;right:2px;min-height:30px;width:30px;padding:0;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:50%}#adm .st.on{color:#ffd84a;background:rgba(0,0,0,.75)}
#adm .grid span{display:block;font-size:11px;color:var(--mute);text-align:center}
#adm .cam{border:1px solid var(--line);border-radius:8px;padding:4px 12px 12px;margin-top:14px}#adm .rng{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#appver{align-self:flex-start;padding:6px 14px;min-height:32px;font-size:12px;color:var(--mute);user-select:none;-webkit-user-select:none}
.pfr{display:flex;gap:8px;align-items:flex-start;margin-top:8px}
.pfc{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.pfi{width:100%;aspect-ratio:3/4;border-radius:10px;background:var(--card);border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.pfi img{width:100%;height:100%;object-fit:cover}
.pfc button{width:100%;min-height:44px;padding:4px 6px;font-size:13px;line-height:1.15}
#ad .bkb{flex:0 0 64px}
#bd{justify-content:flex-end;gap:4px;padding:6px 8px}
#bd .bkb{width:88px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px 2px;border:0;background:none;color:var(--ink);font-size:12px;line-height:1.15}
#bd .bkb svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#hd{gap:4px;padding:6px 8px}
#hd .tb{flex:1;min-width:0;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px 2px;border:0;background:none;color:var(--ink);font-size:12px;line-height:1.15}
#hd .tb:disabled{opacity:.45}
#hd .tb svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs{display:flex;gap:8px;margin:8px 0 10px}
.tabs .tab{flex:1;min-height:44px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-size:15px}
.tabs .tab.on{border-color:var(--ink);font-weight:600}
.pmenu{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:16px;max-width:92vw}
.pm-btns{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.pm-btns button{min-height:44px}
.pm-btns .danger{color:var(--red)}
.pm-pair{display:flex;gap:8px}
.pm-pair figure{flex:1;margin:0;text-align:center;font-size:12px}
.pm-pair img{width:100%;border-radius:8px}
#brand{display:flex;justify-content:center;align-items:center;padding:8px 0 4px;background:var(--bg);flex:0 0 auto}
#brand img{height:clamp(44px,7vh,64px);width:auto;display:block}
#brand[hidden]{display:none}
</style>
</head>
<body>
<div id="brand"><img src="logo.png" alt="NiceShot sports photography"></div>
<header><h1 id="ti">Photo Sharing</h1><a class="hb" id="igh" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r=".7"/></svg><span data-t="contact"></span></a></header>
<main>
  <section id="home"><div id="car"></div><div id="dots"></div><div id="appver"></div></section>
  <section id="pinbox" hidden>
    <h2 id="pn1"></h2><div class="meta" id="pn2"></div>
    <p style="margin:22px 0 10px" data-t="pin_prompt"></p>
    <input id="pin" type="tel" inputmode="numeric" pattern="[0-9]*" enterkeyhint="go" maxlength="4" autocomplete="off" data-ta="pin_aria">
    <p class="mute" id="pe"></p>
  </section>
  <section id="album" hidden>
    <div class="bar"><button id="sv" class="p" hidden></button></div>
    <div id="pg" class="prog" hidden><span id="pt"></span> <button id="pc" style="min-height:32px" data-t="cancel"></button><i id="pb"></i></div>
    <div id="fl" class="tabs" hidden></div>
    <div class="g" id="gr"></div>
  </section>
<section id="prof" hidden>
  <div id="pfl" class="pfr"></div>
  <p id="pfe" style="color:var(--red);margin:12px 0 0;font-size:14px;text-align:center"></p>
</section>
<section id="adm" hidden>
<div id="x-body" hidden>
  <div class="row" style="margin:0 0 6px"><button class="primary" id="x-new" style="flex:1">Novo evento</button><button id="x-cfg">Configurar</button><button type="button" id="x-diag">Diagnóstico do Drive</button></div>
  <div class="mute" id="x-ver"></div>
  <div id="x-list"></div>
<dialog id="x-dc"><form method="dialog">
  <b>Conexão</b>
  <label>Endereço do Worker</label><input type="text" id="x-cu" placeholder="https://niceshot-api.seu-nome.workers.dev" autocapitalize="off">
  <label>Chave de admin</label><input type="password" id="x-ck" autocomplete="off">
  <label>Pasta do Drive de todos os eventos (link ou ID)</label><input type="text" id="x-cf" autocapitalize="off">
  <div class="row"><button class="primary" id="x-cs" value="ok">Salvar</button><button value="x">Cancelar</button></div>
</form></dialog><dialog id="x-de"><form method="dialog">
  <b id="x-et">Novo evento</b>
  <label>Nome do evento</label><input type="text" id="x-n">
  <label>Local</label><input type="text" id="x-pl" placeholder="ex.: Clube, cidade">
  <label>Primeiro dia do evento (fotos a partir das 00:00)</label><input type="date" id="x-df">
  <label>Último dia do evento (fotos até as 23:59)</label><input type="date" id="x-dt">
  <label>PIN de acesso (4 dígitos; vazio = gerar automático)</label><input type="text" id="x-pn" inputmode="numeric" maxlength="4" autocomplete="off">
  <label class="chk"><input type="checkbox" id="x-a" checked> Permitir baixar as fotos</label>
  <label class="chk"><input type="checkbox" id="x-l" checked> Aparecer na lista inicial do app</label>
  <div class="row"><button class="primary" id="x-es" value="ok">Salvar evento</button><button value="x">Cancelar</button></div>
</form></dialog><dialog id="x-dp"><form method="dialog">
  <b id="x-pt">Fotos</b> <span class="mute" id="x-pc"></span>
  
  <div class="grid" id="x-pg"></div>
  <div class="row"><button type="button" id="x-pr">Atualizar lista</button><button value="x">Fechar</button></div>
</form></dialog></div>
<dialog id="x-lk"><form method="dialog"><b>Acesso ao admin</b><label>Senha de admin</label><input type="password" id="x-kk" autocomplete="off"><p class="mute" id="x-ke"></p><div class="row"><button class="primary" id="x-ko" value="ok">Entrar</button><button value="x">Cancelar</button></div></form></dialog>
</section>
</main>
<section id="vw" hidden>
  <img id="vi" alt="">
  <div class="top"><span id="vn"></span><button class="v" id="vs" data-ta="sel_dl"></button></div>
  <button class="side l" id="pv" data-ta="prev_photo">‹</button><button class="side r" id="nx" data-ta="next_photo">›</button>
</section>
<nav class="dock" id="hd"><button class="nv" id="hp" disabled data-ta="prev_ev"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><button class="tb" id="hv" disabled><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></svg><span data-t="view_photos"></span></button><button class="tb" id="pfb"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg><span data-t="my_selfie"></span></button><button class="nv" id="hn" disabled data-ta="next_ev"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button></nav>
<nav class="dock" id="ad" hidden><button id="sf"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg><span data-t="selfie"></span></button><button id="zm"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></svg><span></span></button><button id="dl" disabled><svg viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg><span></span></button><button class="bkb" data-ta="back"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg><span data-t="back"></span></button></nav>
<nav class="dock" id="bd" hidden><button class="bkb" data-ta="back"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg><span data-t="back"></span></button></nav>
<input type="file" id="pffile" accept="image/*" capture="user" hidden>

<div id="msg" role="status"></div>

<script>
const API = "https://niceshot-api.marceloribeiro1711.workers.dev"; // endereço do seu Worker
const IG = "https://www.instagram.com/niceshot.pt/"; // perfil da NiceShot

  view_photos: ["View Photos", "Ver Fotos", "Ver fotos", "Voir les photos"], selfie: ["Search by Selfie", "Procurar com Selfie", "Buscar con selfie", "Chercher par selfie"],
  enlarge: ["Enlarge Photo", "Aumentar Foto", "Ampliar foto", "Agrandir la photo"], thumbs: ["Show Thumbnails", "Ver Fotos pequenas", "Ver miniaturas", "Voir les miniatures"],

  none_mine: ["No photos of you found here.", "Nenhuma foto sua por aqui.", "No hay fotos tuyas aquí.", "Aucune photo de vous ici."], none_yet: ["No photos here yet.", "Nenhuma foto por aqui ainda.", "Aún no hay fotos aquí.", "Pas encore de photos ici."],

// ajuste automático: níveis de luz e contraste (no navegador, sem serviço externo); mostra antes e depois
// ajuste manual: brilho, contraste, vibração e temperatura (valores de -1 a 1; 0 = original)
function renderEdit(im, p, maxW) {
  const sc = maxW && im.naturalWidth > maxW ? maxW / im.naturalWidth : 1;
  const W = Math.round(im.naturalWidth * sc), H = Math.round(im.naturalHeight * sc), n = W * H;
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d"); x.drawImage(im, 0, 0, W, H);
  const d = x.getImageData(0, 0, W, H), px = d.data; let before = 0, after = 0;
  const cf = 1 + p.c * 0.6;                       // contraste em torno do meio-cinza
  for (let i = 0; i < px.length; i += 4) {
    let r = px[i], g = px[i + 1], bl = px[i + 2];
    before += 0.299 * r + 0.587 * g + 0.114 * bl;
    r += p.b * 60; g += p.b * 60; bl += p.b * 60;                       // brilho
    r = (r - 128) * cf + 128; g = (g - 128) * cf + 128; bl = (bl - 128) * cf + 128; // contraste
    r += p.t * 25; bl -= p.t * 25;                                       // temperatura (quente = mais vermelho)
    const lum = 0.299 * r + 0.587 * g + 0.114 * bl;
    const mx = Math.max(r, g, bl), mn = Math.min(r, g, bl), sat = (mx - mn) / 255;
    const vf = 1 + p.v * 0.8 * (1 - sat);                               // vibração: poupa cores já fortes
    r = lum + (r - lum) * vf; g = lum + (g - lum) * vf; bl = lum + (bl - lum) * vf;
    px[i] = Math.min(255, Math.max(0, r)); px[i + 1] = Math.min(255, Math.max(0, g)); px[i + 2] = Math.min(255, Math.max(0, bl));
    after += 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];
  }
  before /= n; after /= n;
  if (after < 5) throw new Error("o ajuste deixou a foto escura demais; nada foi salvo");
  x.putImageData(d, 0, 0);
  return { dataUrl: c.toDataURL("image/jpeg", 0.92), before, after };
}

}

const RATIO = new Map();
const camTile = () => `<div class="camt"><svg viewBox="0 0 24 24"><path d="M3 8h3l2-3h8l2 3h3v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg><b>${esc(S.info?.name || "")}</b></div>`;
// coloca cada foto na coluna mais curta; o tile da câmera ocupa meia altura de uma foto vertical 3:4
function doLayout() {
  const g = $("#gr"); if (!g) return;
  const items = [...g.children].filter(el => el.classList.contains("t") || el.classList.contains("camt"));
  if (!items.length) { g.style.height = ""; return; }
  const W = g.clientWidth; if (!W) return;
  const gap = 4, cols = W >= 700 ? 3 : 2, cw = (W - gap * (cols - 1)) / cols;
  const h = new Array(cols).fill(0);
  for (const el of items) {
    let c = 0; for (let k = 1; k < cols; k++) if (h[k] < h[c]) c = k;
    let ht;
    if (el.classList.contains("camt")) ht = cw * (4 / 3) / 2;
    else {
      const r = Math.min(2.5, Math.max(0.4, RATIO.get(el.dataset.id) || Number(el.dataset.r) || 0.75));
      el.dataset.used = r; ht = cw / r;
    }
    el.style.cssText = `width:${cw}px;height:${ht}px;left:${c * (cw + gap)}px;top:${h[c]}px`;
    h[c] += ht + gap;
    const img = el.querySelector("img");
    if (img && !img.dataset.b) { img.dataset.b = "1"; img.addEventListener("load", () => measured(el, img)); }
  }
  g.style.height = Math.max(...h) + "px";
}

  const real = img.naturalWidth / img.naturalHeight;
  if (Math.abs(real - Number(el.dataset.used)) > 0.01) { RATIO.set(el.dataset.id, real); scheduleLayout(); }
}

/* ---- selfie: reconhecimento facial no próprio aparelho ---- */
let faceReady;
const loadFace = () => faceReady ||= (async () => {
  await new Promise((ok, no) => { const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"; s.onload = ok; s.onerror = () => no(new Error(tr("face_load"))); document.head.appendChild(s); });
  const M = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/";
  await Promise.all([faceapi.nets.ssdMobilenetv1.loadFromUri(M), faceapi.nets.faceLandmark68Net.loadFromUri(M), faceapi.nets.faceRecognitionNet.loadFromUri(M)]);
})().catch(e => { faceReady = null; throw e; });
const img = (src, cors) => new Promise((ok, no) => { const i = new Image(); if (cors) i.crossOrigin = "anonymous"; i.onload = () => ok(i); i.onerror = no; i.src = src; });
const prog = (t, pct) => { $("#pg").hidden = pct < 0; $("#pt").textContent = t; $("#pb").style.width = Math.max(pct, 0) + "%"; };

$("#sf").onclick = () => startSearch();
$("#pc").onclick = () => { S.run++; prog("", -1); };
/* ---- busca por selfie: o Mac faz a comparação (Photo Server 0.4) ---- */
const apiBase = () => (localStorage.getItem("ns_url") || API).trim().replace(/\/+$/, "");
const sleep = ms => new Promise(r => setTimeout(r, ms));
const dataUrl = b => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => no(r.error); r.readAsDataURL(b); });
async function myCode() {
  let c = await pget("code").catch(() => null);
  if (!c) { c = Array.from(crypto.getRandomValues(new Uint8Array(24)), b => (b % 36).toString(36)).join(""); await pput("code", c).catch(() => {}); }
  return c;
}
async function selfieStatus(code) {
  try { const r = await fetch(apiBase() + "/api/selfie/status?code=" + encodeURIComponent(code)); return r.ok ? await r.json() : { state: "error" }; }
  catch { return { state: "error" }; }
}
function applyResult(st, quiet) {
  S.busy = false; prog("", -1);
  if (st.state === "done") {
    S.mine = new Set(st.ids || []); S.mineState = "done";
    const n = S.photos.filter(p => S.mine.has(p.id)).length;
    if (!quiet) say(n ? tr("mine_n", { n }) : tr("none_event"));
  } else if (st.state === "nomatch") { S.mine = new Set(); S.mineState = "nomatch"; if (!quiet) say(tr("none_event")); }
  else { S.mine = null; S.mineState = "error"; if (!quiet) say(tr("svc_off")); }
  S.tab = "mine"; draw();
}
// contador de 20 s ("Agrupando suas fotos") e depois de 10 s ("Preparando a apresentação das fotos"); consulta o correio a cada 2 s e mostra o resultado assim que chegar
async function waitFor(code) {
  const run = S.run;
  for (const [secs, key] of [[20, "agr"], [10, "prep"]]) {
    for (let t = secs; t > 0; t--) {
      if (S.run !== run) return null;
      prog(`${tr(key)} (${t}s)`, (secs - t + 1) / secs * 100);
      await sleep(1000);
      if (t % 2 === 0) { const st = await selfieStatus(code); if (["done", "nomatch", "error", "offline"].includes(st.state)) { S.dbg = "status " + st.state; return st; } }
    }
  }
  S.dbg = "sem resposta do Mac em 30 s";
  return { state: "error" };
}
async function startSearch() {
  if (S.busy) return;
  const images = {};
  for (const k of SLOTS) { const b = await pget(k).catch(() => null); if (b) images[k] = await dataUrl(b); }
  if (!Object.keys(images).length) { S.tab = "all"; show("prof"); return drawProfile(); }
  if (!localStorage.getItem("ns_consent")) {
    if (!confirm(tr("selfie_ask"))) { S.tab = "all"; return draw(); }
    localStorage.setItem("ns_consent", "1");
  }
  if (!$("#vw").hidden) closeViewer();
  S.busy = true; S.tab = "mine"; S.mine = null; S.mineState = "searching"; draw();
  const code = await myCode();
  let r = { state: "error" }; S.dbg = "";
  try {
    const res = await fetch(apiBase() + "/api/selfie/search", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code, images }) });
    S.dbg = "HTTP " + res.status;
    if (res.ok) r = await res.json();
    if (r.state) S.dbg += " · " + r.state;
  } catch (e) { S.dbg = "falha de rede: " + (e && e.message ? e.message : e); }
  if (r.state !== "pending") return applyResult({ state: "error" });
  const st = await waitFor(code);
  if (st) applyResult(st); else S.busy = false;
}
// toque na aba Minhas Fotos: sem selfies vai ao Perfil; sem busca ainda, faz a busca; senão mostra o resultado atual
async function openMine() {
  if (S.busy) { S.tab = "mine"; return draw(); }
  const f = await pget("front").catch(() => null), l = await pget("left").catch(() => null), rt = await pget("right").catch(() => null);
  if (!f && !l && !rt) { S.tab = "all"; show("prof"); return drawProfile(); }
  S.tab = "mine"; draw();
  const code = await myCode();
  const st = await selfieStatus(code);
  if (st.state === "none") return startSearch();
  if (st.state === "pending" || st.state === "processing") { S.busy = true; S.mineState = "searching"; draw(); const w = await waitFor(code); if (w) applyResult(w, true); else S.busy = false; return; }
  applyResult(st, true);
}
